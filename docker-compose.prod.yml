services:
  postgres:
    image: postgres:16-alpine
    container_name: shortener_postgres_prod
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      # Map database files directly to AWS EBS persistent volume
      - /mnt/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shortener_user} -d ${POSTGRES_DB:-shortener_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortener_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_migration_prod
    command: npm run db:migrate
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_auth_prod
    restart: always
    command: npm run start:auth
    env_file:
      - ./backend/.env
    depends_on:
      migration:
        condition: service_completed_successfully

  url-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_url_prod
    restart: always
    command: npm run start:url
    env_file:
      - ./backend/.env
    depends_on:
      migration:
        condition: service_completed_successfully

  redirect-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_redirect_prod
    restart: always
    command: npm run start:redirect
    env_file:
      - ./backend/.env
    depends_on:
      migration:
        condition: service_completed_successfully

  analytics-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_analytics_prod
    restart: always
    command: npm run start:analytics
    env_file:
      - ./backend/.env
    depends_on:
      migration:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_gateway_prod
    restart: always
    command: npm run start:gateway
    env_file:
      - ./backend/.env
    depends_on:
      - auth-service
      - url-service
      - analytics-service

  nginx:
    image: nginx:alpine
    container_name: shortener_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
      - redirect-service

volumes:
  redis_prod_data:
