services:
  url-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_url_prod
    restart: always
    command: npm run start:url
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5002:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redirect-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_redirect_prod
    restart: always
    command: npm run start:redirect
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5003:5003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
