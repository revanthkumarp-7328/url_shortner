services:
  url-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_url_prod
    restart: always
    command: npm run start:url
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redirect-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener_redirect_prod
    restart: always
    command: npm run start:redirect
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: shortener_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - url-service
      - redirect-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
