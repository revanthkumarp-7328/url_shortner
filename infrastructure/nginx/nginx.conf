events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. API Gateway Proxy (api.zipurl.dpdns.org)
    server {
        listen 80;
        server_name api.zipurl.dpdns.org api.*;

        # Dynamic Docker DNS resolution to prevent 502 Bad Gateway on container restarts
        resolver 127.0.0.11 valid=10s;
        set $gateway_upstream http://api-gateway:5000;

        location / {
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
    }

    # 2. Ultra-Fast Short Link Redirection Engine (s.zipurl.dpdns.org)
    server {
        listen 80;
        server_name s.zipurl.dpdns.org s.* default_server;

        # Dynamic Docker DNS resolution to prevent 502 Bad Gateway on container restarts
        resolver 127.0.0.11 valid=10s;
        set $redirect_upstream http://redirect-service:5003;

        location / {
            proxy_pass $redirect_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
    }
}
