events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # HTTP Server: Redirect all Port 80 traffic to Port 443 HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 1. URL Shortening Microservice Proxy (api.zipurl.dpdns.org:443)
    server {
        listen 443 ssl;
        server_name api.zipurl.dpdns.org api.*;

        ssl_certificate /etc/ssl/certs/origin-cert.pem;
        ssl_certificate_key /etc/ssl/private/origin-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://127.0.0.1:5002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
    }

    # 2. Ultra-Fast Short Link Redirection Engine Microservice Proxy (s.zipurl.dpdns.org:443)
    server {
        listen 443 ssl default_server;
        server_name s.zipurl.dpdns.org s.* _;

        ssl_certificate /etc/ssl/certs/origin-cert.pem;
        ssl_certificate_key /etc/ssl/private/origin-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://127.0.0.1:5003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
    }
}
